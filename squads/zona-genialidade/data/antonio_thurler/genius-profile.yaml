  # =====================================================================
  # SÍNTESE CRUZADA
  # =====================================================================
  cross_framework_synthesis:
    convergencias:
      - id: "CONV-1"
        nome: "EDUCADOR-CRIADOR SISTÊMICO"
        frameworks: ["hendricks", "clifton", "sullivan", "hamilton"]
        descricao: >
          Quatro frameworks independentes apontam para o mesmo núcleo:
          Antonio cria metodologias educacionais (Hendricks: Zona de Genialidade;
          Clifton: Strategic+Ideation+Communication; Sullivan: UA = transformar
          complexo em claro; Hamilton: Creator primário). Isso NÃO é coincidência
          — é o seu perfil mais fundamental.
        confianca: 0.95

      - id: "CONV-2"
        nome: "QUICK STARTER COM CAPACIDADE DE SISTEMIZAR"
        frameworks: ["kolbe", "hamilton", "sullivan"]
        descricao: >
          Kolbe Quick Start 8 + Hamilton Lord secundário + Sullivan (Follow Thru
          em delegação) = raro Creator que consegue sistemizar. A maioria dos
          Quick Starts abandona projetos. Antonio tem o Follow Thru necessário
          para completar O QUE IMPORTA e delegar o resto.
        confianca: 0.88

      - id: "CONV-3"
        nome: "LÍDER DE OPINIÃO NATURAL"
        frameworks: ["clifton", "hogshead", "hendricks"]
        descricao: >
          Clifton Communication+Activator + Hogshead Power+Passion (The Maestro)
          + Hendricks flow em ensinar/comunicar = pessoa wired para construir
          audiência e influência. Não é uma habilidade a desenvolver — é um
          instinto natural sendo subaproveitado.
        confianca: 0.87

      - id: "CONV-4"
        nome: "MODELO DE NEGÓCIO IDEAL: EDUCAÇÃO ESCALÁVEL"
        frameworks: ["hamilton", "hormozi", "sullivan"]
        descricao: >
          Hamilton Creator que escala via sistemas + Hormozi canal Content +
          Sullivan UA em educação = o modelo de negócio natural de Antonio é
          educação digital escalável com componente de mentoria premium.
          Reduka é o veículo mais alinhado com esse perfil.
        confianca: 0.90

      - id: "CONV-5"
        nome: "BLOQUEIO: CAPITAL ≠ CAUSA, OFERTA = SOLUÇÃO"
        frameworks: ["hormozi", "hendricks", "hamilton"]
        descricao: >
          Hormozi (oferta, não capital) + Hendricks ULP Tipo 1 (indignidade
          financeira) + Hamilton Yellow→Green (transição via oferta, não crédito)
          convergem: o bloqueio financeiro se resolve criando uma oferta de alto
          valor, não tomando empréstimo. O capital virá da oferta certa.
        confianca: 0.88

    insights_unicos:
      - framework: "hormozi"
        insight: >
          A sinergia V4+Reduka é o Grand Slam Offer não explorado: Antonio tem
          metodologia de educação E acesso a metodologia de marketing. Pode criar
          o produto que ensina empreendedores a educarem para lucrar — usando
          exatamente o que ele mesmo está vivendo como caso de estudo.

      - framework: "hogshead"
        insight: >
          O arquétipo Maestro significa que Antonio não precisa escolher entre
          ser o professor sério ou o mentor caloroso. Essa dualidade é exatamente
          o que o torna diferente — e é o que deve comunicar explicitamente.

      - framework: "kolbe"
        insight: >
          O Follow Thru 6 (não 8 ou 9) significa que Antonio precisa de um
          parceiro operacional com Follow Thru alto para cada negócio que escala.
          Com o parceiro certo, ele é imparável. Sem ele, a sistemização fica
          incompleta.

    contradicoes_documentadas:
      - contradicao: "Melhorar existente vs. ser o primeiro"
        resolucao: >
          Isso é na verdade uma sequência: Antonio CRIA algo novo primeiro
          (Creator/Quick Start), depois OTIMIZA para excelência (Lord/Follow Thru).
          Não é contradição — é o seu ciclo de operação natural.

      - contradicao: "Risco moderado vs. três frentes simultâneas"
        resolucao: >
          Antonio distribui risco através de múltiplas apostas ao mesmo tempo
