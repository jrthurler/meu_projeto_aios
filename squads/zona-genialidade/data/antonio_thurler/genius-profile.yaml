    wealth_spectrum:
      nivel_atual: "Yellow (Jogador)"
      evidencia: >
        Tem negócios próprios, renda variável, está expandindo (V4, Happy, Reduka).
        Ainda opera pessoalmente em muitas frentes — transição para Green.
      nivel_alvo_90_dias: "Yellow → Green"
      nivel_alvo_12_meses: "Green (Empreendedor — negócio funciona sem ele)"
