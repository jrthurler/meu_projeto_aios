  # =====================================================================
  # TIER 1: ALEX HORMOZI — Value Equation e Monetização
  # =====================================================================
  hormozi_analysis:
    agente: "alex-hormozi"
    confianca: 0.86

    value_equation:
      formula: "Valor = (Dream Outcome × Perceived Likelihood) / (Time Delay × Effort & Sacrifice)"

      dream_outcome:
        score: 9
        analise: >
          Antonio trabalha com dois mercados de alto sonho: empreendedores querendo
          crescer e pais querendo futuro melhor para filhos (Happy). Ambos têm
          dream outcome claro e urgente.

      perceived_likelihood:
        score: 6
        analise: >
          Metodologias ainda precisam de prova social escalada. Alunos existentes
          validam, mas precisa de casos de sucesso documentados e visíveis.
        acao: "Capturar e publicar 5-10 casos de transformação mensuráveis (resultados em R$ ou mudanças concretas)"

      time_delay:
        score: 5
        analise: >
          Educação tem percepção de resultado lento. Oportunidade de criar
          'quick wins' no início do processo — alunos veem resultado em
          30 dias, não 6 meses.
        acao: "Redesenhar onboarding para entrega de resultado tangível nos primeiros 30 dias"

      effort_sacrifice:
        score: 6
        analise: >
          Metodologia atual parece demandar esforço do aluno. Oportunidade de
          criar 'done with you' ou 'done for you' em algum nível.
        acao: "Criar versão high-touch premium que reduz esforço do aluno"

    grand_slam_offer:
      conceito: >
        "Em 90 dias, você vai criar seu primeiro produto digital educacional
        validado e faturando, mesmo que comece do zero — ou eu trabalho
        de graça até acontecer."
      elementos:
        - "Resultado específico e mensurável (produto + faturamento)"
        - "Prazo concreto (90 dias)"
        - "Garantia de risco reverso (trabalho de graça até acontecer)"
        - "Para quem tem identidade empreendedora já formada"
      fit_com_antonio: >
        Antonio tem todas as ferramentas para entregar essa promessa:
        experiência em educação, metodologia própria (Reduka), entendimento
        de marketing (V4), e habilidade de ensinar complexo de forma simples.

    core_4_channel:
      canal_primario: "Content (educação + autoridade)"
      canal_secundario: "Referrals (alunos → alunos, network V4)"
      canal_terciario: "Outreach (para franquias Happy e Reduka presencial)"
      nota: >
        Com V4 como franqueado, Antonio tem acesso a metodologia de marketing
        que pode acelerar drasticamente a aquisição de alunos para Reduka.
        Essa é a sinergia mais poderosa que ele tem hoje.

    bottleneck_analise:
      bottleneck_atual: "Oferta (não capital)"
      explicacao: >
        A restrição de crédito é sintoma, não causa. A causa é que as ofertas
        atuais provavelmente têm ticket médio baixo para o valor entregue.
        Ao criar uma oferta de alto ticket com promessa clara e garantia,
        o capital começa a fluir internamente antes de precisar de crédito externo.
      prioridade_90_dias: "Criar oferta premium de R$5k-15k para o mercado de educação empreendedora"

